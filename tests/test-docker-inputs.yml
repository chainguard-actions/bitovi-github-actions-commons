name: Test Docker inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          bitops_skip_run: 'true'
          docker_install: 'false'
          docker_remove_orphans: 'false'
          docker_full_cleanup: 'false'
          docker_repo_app_directory: '.'
          docker_repo_app_directory_cleanup: 'false'
          docker_efs_mount_target: '/data'
          docker_cloudwatch_enable: 'false'
          docker_cloudwatch_lg_name: 'test-docker-logs'
          docker_cloudwatch_skip_destroy: 'false'
          docker_cloudwatch_retention_days: '14'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
