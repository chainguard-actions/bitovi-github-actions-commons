name: Test - Terraform stack destroy mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in destroy mode
        id: action
        uses: .
        with:
          checkout: 'false'
          tf_stack_destroy: 'true'
          aws_resource_identifier: 'test-commons-destroy'
          aws_default_region: 'us-east-1'
          # In destroy mode without AWS credentials, check_statefile will fail
          # or return no state file, so the action exits with "nothing to create/destroy"
        continue-on-error: true

      - name: Assert action handled destroy mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # In destroy mode, the action checks for an existing state file in S3.
          # Without AWS credentials, this check fails or finds nothing.
          # Either outcome (success with "nothing to destroy" or failure) is acceptable.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed in destroy mode (no state file found)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without AWS credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
