name: Test stack destroy mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # With tf_stack_destroy=true and bitops_skip_run=true, the action should
      # set up the destroy configuration and exit before running Docker
      - id: action
        uses: .
        with:
          checkout: 'false'
          tf_stack_destroy: 'true'
          bitops_skip_run: 'true'
          aws_default_region: 'us-east-1'
          aws_resource_identifier: 'test-destroy'
          tf_state_bucket: 'my-test-tf-state-bucket'
        continue-on-error: true

      - name: Assert action ran in destroy mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed in destroy mode with bitops_skip_run=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
