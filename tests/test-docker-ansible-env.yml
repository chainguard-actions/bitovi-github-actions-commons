name: Test Docker, Ansible, env files, and misc inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          bitops_skip_run: 'true'
          # BitOps extras
          bitops_extra_env_vars: '-e CUSTOM_VAR=value'
          bitops_extra_env_vars_file: ''
          bitops_code_store: 'false'
          # Ansible
          ansible_ssh_to_private_ip: 'false'
          ansible_start_docker_timeout: '300'
          # Env files
          env_aws_secret: ''
          env_repo: ''
          env_ghs: ''
          env_ghv: ''
          # TF state extras
          tf_state_file_name: 'tf-state'
          tf_state_file_name_append: ''
          tf_state_bucket_destroy: 'false'
          tf_targets: ''
          # Docker
          docker_install: 'false'
          docker_remove_orphans: 'false'
          docker_full_cleanup: 'false'
          docker_repo_app_directory: ''
          docker_repo_app_directory_cleanup: 'false'
          docker_efs_mount_target: '/data'
          docker_cloudwatch_enable: 'false'
          docker_cloudwatch_lg_name: ''
          docker_cloudwatch_skip_destroy: 'false'
          docker_cloudwatch_retention_days: '14'
          # GitHub deployment repo
          gh_deployment_input_terraform: ''
          gh_deployment_input_ansible: ''
          gh_deployment_input_ansible_extra_vars_file: ''
          gh_deployment_action_input_ansible_extra_vars_file: ''
          gh_deployment_input_helm_charts: ''
          # GitHub action repo
          gh_action_repo: ''
          gh_action_input_terraform: ''
          gh_action_input_ansible: ''
          gh_action_input_helm_charts: ''
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
