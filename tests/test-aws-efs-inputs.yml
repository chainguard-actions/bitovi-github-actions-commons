name: Test AWS EFS inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          checkout: 'false'
          bitops_skip_run: 'true'
          aws_efs_create: 'false'
          aws_efs_fs_id: 'fs-12345678'
          aws_efs_create_mount_target: 'false'
          aws_efs_create_ha: 'false'
          aws_efs_vol_encrypted: 'false'
          aws_efs_kms_key_id: 'arn:aws:kms:us-east-1:123456789012:key/example'
          aws_efs_performance_mode: 'generalPurpose'
          aws_efs_throughput_mode: 'bursting'
          aws_efs_throughput_speed: '100'
          aws_efs_security_group_name: 'my-efs-sg'
          aws_efs_allowed_security_groups: 'sg-12345678'
          aws_efs_ingress_allow_all: 'false'
          aws_efs_create_replica: 'false'
          aws_efs_replication_destination: 'us-west-2'
          aws_efs_enable_backup_policy: 'false'
          aws_efs_transition_to_inactive: 'AFTER_30_DAYS'
          aws_efs_mount_target: '/data'
          aws_efs_ec2_mount_point: '/mnt/efs'
          aws_efs_additional_tags: '{"env":"test"}'
      - name: Assert action completed
        run: |
          echo "Action completed successfully with EFS inputs"
          echo "PASS"
