name: Test Aurora inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          bitops_skip_run: 'true'
          checkout: 'false'
          aws_aurora_enable: 'false'
          aws_aurora_proxy: 'false'
          aws_aurora_cluster_name: 'my-aurora-cluster'
          aws_aurora_engine: 'aurora-postgresql'
          aws_aurora_engine_version: '14.6'
          aws_aurora_engine_mode: 'provisioned'
          aws_aurora_availability_zones: 'us-east-1a,us-east-1b'
          aws_aurora_cluster_apply_immediately: 'false'
          aws_aurora_allocated_storage: '100'
          aws_aurora_storage_encrypted: 'true'
          aws_aurora_kms_key_id: 'arn:aws:kms:us-east-1:123456789012:key/abc'
          aws_aurora_storage_type: 'io1'
          aws_aurora_storage_iops: '3000'
          aws_aurora_database_name: 'aurora'
          aws_aurora_master_username: 'aurora'
          aws_aurora_database_group_family: 'aurora-postgresql14'
          aws_aurora_iam_auth_enabled: 'false'
          aws_aurora_iam_roles: 'arn:aws:iam::123456789012:role/my-role'
          aws_aurora_cluster_db_instance_class: 'db.r6g.large'
          aws_aurora_security_group_name: 'my-aurora-sg'
          aws_aurora_ingress_allow_all: 'true'
          aws_aurora_allowed_security_groups: 'sg-12345678'
          aws_aurora_db_publicly_accessible: 'false'
          aws_aurora_subnets: 'subnet-12345678,subnet-87654321'
          aws_aurora_database_port: '5432'
          aws_aurora_cloudwatch_enable: 'true'
          aws_aurora_cloudwatch_log_type: 'postgresql'
          aws_aurora_cloudwatch_retention_days: '7'
          aws_aurora_backtrack_window: '0'
          aws_aurora_backup_retention_period: '5'
          aws_aurora_backup_window: '02:00-03:00'
          aws_aurora_maintenance_window: 'Mon:00:00-Mon:03:00'
          aws_aurora_database_final_snapshot: 'my-final-snapshot'
          aws_aurora_deletion_protection: 'false'
          aws_aurora_delete_auto_backups: 'true'
          aws_aurora_restore_snapshot_id: 'my-snapshot'
          aws_aurora_restore_to_point_in_time: '{}'
          aws_aurora_snapshot_name: 'my-snapshot'
          aws_aurora_snapshot_overwrite: 'false'
          aws_aurora_db_instances_count: '1'
          aws_aurora_db_instance_class: 'db.r6g.large'
          aws_aurora_db_apply_immediately: 'false'
          aws_aurora_db_ca_cert_identifier: 'rds-ca-ecc384-g1'
          aws_aurora_db_maintenance_window: 'Mon:00:00-Mon:03:00'
          aws_aurora_additional_tags: '{"env":"test"}'
      - name: Assert action ran
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran with Aurora inputs"
          else
            echo "FAIL: unexpected outcome"
            exit 1
          fi
