name: Test AWS EFS and RDS inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          checkout: 'false'
          bitops_skip_run: 'true'
          # EFS inputs
          aws_efs_create: 'false'
          aws_efs_fs_id: ''
          aws_efs_create_mount_target: 'false'
          aws_efs_create_ha: 'false'
          aws_efs_vol_encrypted: 'false'
          aws_efs_kms_key_id: ''
          aws_efs_performance_mode: 'generalPurpose'
          aws_efs_throughput_mode: 'bursting'
          aws_efs_throughput_speed: ''
          aws_efs_security_group_name: 'test-efs-sg'
          aws_efs_allowed_security_groups: ''
          aws_efs_ingress_allow_all: 'false'
          aws_efs_create_replica: 'false'
          aws_efs_replication_destination: ''
          aws_efs_enable_backup_policy: 'false'
          aws_efs_transition_to_inactive: ''
          aws_efs_mount_target: '/data'
          aws_efs_ec2_mount_point: '/data'
          aws_efs_additional_tags: '{"env":"test"}'
          # RDS inputs
          aws_rds_db_enable: 'false'
          aws_rds_db_proxy: 'false'
          aws_rds_db_identifier: 'test-db'
          aws_rds_db_name: 'testdb'
          aws_rds_db_user: 'dbuser'
          aws_rds_db_engine: 'postgres'
          aws_rds_db_engine_version: '14'
          aws_rds_db_ca_cert_identifier: 'rds-ca-ecc384-g1'
          aws_rds_db_security_group_name: 'test-rds-sg'
          aws_rds_db_allowed_security_groups: ''
          aws_rds_db_ingress_allow_all: 'false'
          aws_rds_db_publicly_accessible: 'false'
          aws_rds_db_port: '5432'
          aws_rds_db_subnets: ''
          aws_rds_db_allocated_storage: '10'
          aws_rds_db_max_allocated_storage: '0'
          aws_rds_db_storage_encrypted: 'false'
          aws_rds_db_storage_type: 'gp2'
          aws_rds_db_kms_key_id: ''
          aws_rds_db_instance_class: 'db.t3.micro'
          aws_rds_db_final_snapshot: 'false'
          aws_rds_db_restore_snapshot_identifier: ''
          aws_rds_db_cloudwatch_logs_exports: ''
          aws_rds_db_multi_az: 'false'
          aws_rds_db_maintenance_window: ''
          aws_rds_db_apply_immediately: 'false'
          aws_rds_db_performance_insights_enable: 'false'
          aws_rds_db_performance_insights_retention: '7'
          aws_rds_db_performance_insights_kms_key_id: ''
          aws_rds_db_monitoring_interval: '0'
          aws_rds_db_monitoring_role_arn: ''
          aws_rds_db_insights_mode: ''
          aws_rds_db_allow_major_version_upgrade: 'false'
          aws_rds_db_auto_minor_version_upgrade: 'true'
          aws_rds_db_backup_retention_period: '7'
          aws_rds_db_backup_window: ''
          aws_rds_db_copy_tags_to_snapshot: 'false'
          aws_rds_db_additional_tags: '{"env":"test"}'
      - name: Assert action ran
        run: |
          echo "Action completed with bitops_skip_run=true"
          echo "PASS"
