name: Test AWS VPC and EC2 inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          bitops_skip_run: 'true'
          checkout: 'false'
          aws_access_key_id: 'AKIAIOSFODNN7EXAMPLE'
          aws_secret_access_key: 'wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY'
          aws_session_token: 'AQoDYXdzEJr//example'
          aws_additional_tags: '{"env":"test"}'
          aws_vpc_create: 'false'
          aws_vpc_name: 'test-vpc'
          aws_vpc_cidr_block: '10.0.0.0/16'
          aws_vpc_public_subnets: '10.0.1.0/24'
          aws_vpc_private_subnets: '10.0.2.0/24'
          aws_vpc_availability_zones: 'us-east-1a'
          aws_vpc_id: 'vpc-12345678'
          aws_vpc_subnet_id: 'subnet-12345678'
          aws_vpc_enable_nat_gateway: 'false'
          aws_vpc_single_nat_gateway: 'false'
          aws_vpc_external_nat_ip_ids: 'eipalloc-12345678'
          aws_vpc_additional_tags: '{"env":"test"}'
          aws_ec2_instance_create: 'false'
          aws_ec2_ami_filter: 'ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*'
          aws_ec2_ami_owner: '099720109477'
          aws_ec2_ami_id: 'ami-12345678'
          aws_ec2_ami_update: 'false'
          aws_ec2_iam_instance_profile: 'my-instance-profile'
          aws_ec2_instance_type: 't3.micro'
          aws_ec2_instance_root_vol_size: '20'
          aws_ec2_instance_root_vol_preserve: 'false'
          aws_ec2_security_group_name: 'my-ec2-sg'
          aws_ec2_create_keypair_sm: 'false'
          aws_ec2_instance_public_ip: 'false'
          aws_ec2_port_list: '[80,443]'
          aws_ec2_user_data_file: ''
          aws_ec2_user_data_replace_on_change: 'true'
          aws_ec2_additional_tags: '{"env":"test"}'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
