name: Test AWS EC2 inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          bitops_skip_run: 'true'
          aws_ec2_instance_create: 'false'
          aws_ec2_ami_filter: 'ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*'
          aws_ec2_ami_owner: '099720109477'
          aws_ec2_ami_id: 'ami-12345678'
          aws_ec2_ami_update: 'false'
          aws_ec2_iam_instance_profile: 'my-instance-profile'
          aws_ec2_instance_type: 't3.micro'
          aws_ec2_instance_root_vol_size: '20'
          aws_ec2_instance_root_vol_preserve: 'false'
          aws_ec2_security_group_name: 'my-ec2-sg'
          aws_ec2_create_keypair_sm: 'false'
          aws_ec2_instance_public_ip: 'false'
          aws_ec2_port_list: '[80,443]'
          aws_ec2_user_data_file: ''
          aws_ec2_user_data_replace_on_change: 'true'
          aws_ec2_additional_tags: '{"env":"test"}'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
