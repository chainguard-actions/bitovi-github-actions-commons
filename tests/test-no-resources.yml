name: Test no-resources early exit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with no resources enabled
        id: action
        uses: .
        with:
          checkout: 'false'
          aws_resource_identifier: 'test-commons-noop'
          aws_default_region: 'us-east-1'

      - name: Assert action completed successfully
        run: |
          echo "Action completed with no resources enabled"
          echo "PASS: action exited cleanly (nothing to create or destroy)"
