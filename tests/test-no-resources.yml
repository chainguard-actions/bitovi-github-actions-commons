name: Test - No resources enabled (nothing to deploy)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When no resources are enabled, the action generates an empty bitops config
      # and exits cleanly with "There is nothing to be created or destroyed."
      # No AWS credentials or Docker required.
      - id: action
        uses: .
        with:
          checkout: 'false'
          aws_resource_identifier: 'test-commons-action'
          aws_default_region: 'us-east-1'

      - name: Assert action completed successfully
        run: |
          echo "Action completed without error (no resources enabled = nothing to deploy)"
          echo "PASS"
