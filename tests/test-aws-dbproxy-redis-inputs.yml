name: Test AWS DB Proxy and Redis inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          checkout: 'false'
          bitops_skip_run: 'true'
          aws_db_proxy_enable: 'false'
          aws_db_proxy_name: 'my-db-proxy'
          aws_db_proxy_database_id: 'my-db'
          aws_db_proxy_cluster: 'false'
          aws_db_proxy_secret_name: 'my-db-secret'
          aws_db_proxy_client_password_auth_type: 'POSTGRES_SCRAM_SHA_256'
          aws_db_proxy_tls: 'true'
          aws_db_proxy_security_group_name: 'my-proxy-sg'
          aws_db_proxy_database_security_group_allow: 'true'
          aws_db_proxy_allowed_security_group: 'sg-12345678'
          aws_db_proxy_allow_all_incoming: 'false'
          aws_db_proxy_cloudwatch_enable: 'false'
          aws_db_proxy_cloudwatch_retention_days: '7'
          aws_db_proxy_additional_tags: '{"env":"test"}'
          aws_redis_enable: 'false'
          aws_redis_user: 'redisuser'
          aws_redis_user_access_string: 'on ~* +@all'
          aws_redis_user_group_name: 'my-redis-group'
          aws_redis_security_group_name: 'my-redis-sg'
          aws_redis_ingress_allow_all: 'false'
          aws_redis_allowed_security_groups: 'sg-12345678'
          aws_redis_subnets: 'subnet-12345678'
          aws_redis_port: '6379'
          aws_redis_at_rest_encryption: 'true'
          aws_redis_in_transit_encryption: 'true'
          aws_redis_replication_group_id: 'my-redis'
          aws_redis_node_type: 'cache.t2.small'
          aws_redis_num_cache_clusters: '1'
          aws_redis_parameter_group_name: 'default.redis7'
          aws_redis_num_node_groups: '0'
          aws_redis_replicas_per_node_group: '0'
          aws_redis_multi_az_enabled: 'false'
          aws_redis_automatic_failover: 'false'
          aws_redis_apply_immediately: 'false'
          aws_redis_auto_minor_upgrade: 'true'
          aws_redis_maintenance_window: 'sun:05:00-sun:06:00'
          aws_redis_snapshot_window: '05:00-09:00'
          aws_redis_final_snapshot: ''
          aws_redis_snapshot_restore_name: ''
          aws_redis_cloudwatch_enabled: 'false'
          aws_redis_cloudwatch_lg_name: '/aws/redis/my-redis'
          aws_redis_cloudwatch_log_format: 'json'
          aws_redis_cloudwatch_log_type: 'engine-log'
          aws_redis_cloudwatch_retention_days: '14'
          aws_redis_single_line_url_secret: 'false'
          aws_redis_additional_tags: '{"env":"test"}'
      - name: Assert action completed
        run: |
          echo "Action completed successfully with DB Proxy and Redis inputs"
          echo "PASS"
