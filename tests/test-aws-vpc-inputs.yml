name: Test AWS VPC inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          bitops_skip_run: 'true'
          checkout: 'false'
          aws_vpc_create: 'false'
          aws_vpc_name: 'my-vpc'
          aws_vpc_cidr_block: '10.0.0.0/16'
          aws_vpc_public_subnets: '10.10.110.0/24'
          aws_vpc_private_subnets: '10.10.120.0/24'
          aws_vpc_availability_zones: 'us-east-1a,us-east-1b'
          aws_vpc_id: 'vpc-12345678'
          aws_vpc_subnet_id: 'subnet-12345678'
          aws_vpc_enable_nat_gateway: 'false'
          aws_vpc_single_nat_gateway: 'false'
          aws_vpc_external_nat_ip_ids: ''
          aws_vpc_additional_tags: '{"env":"test"}'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
