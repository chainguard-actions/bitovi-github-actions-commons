name: Test miscellaneous inputs (ansible, bitops, env, gh, tf_state)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          bitops_skip_run: 'true'
          # Ansible inputs
          ansible_skip: 'true'
          ansible_ssh_to_private_ip: 'false'
          ansible_start_docker_timeout: '300'
          # BitOps extra inputs
          bitops_extra_env_vars: '-e MY_VAR=myvalue'
          bitops_extra_env_vars_file: ''
          bitops_code_store: 'false'
          # ENV file inputs
          env_aws_secret: ''
          env_repo: ''
          env_ghs: ''
          env_ghv: ''
          # GitHub deployment repo inputs
          gh_deployment_input_terraform: ''
          gh_deployment_input_ansible: ''
          gh_deployment_input_ansible_extra_vars_file: ''
          gh_deployment_action_input_ansible_extra_vars_file: ''
          gh_deployment_input_helm_charts: ''
          # GitHub action repo inputs
          gh_action_repo: 'https://github.com/example/repo'
          gh_action_input_terraform: ''
          gh_action_input_ansible: ''
          gh_action_input_helm_charts: ''
          # Terraform state inputs
          tf_state_file_name: 'my-tf-state'
          tf_state_file_name_append: 'unique'
          tf_state_bucket: 'my-tf-state-bucket'
          tf_state_bucket_destroy: 'false'
          tf_targets: 'module.vpc'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
