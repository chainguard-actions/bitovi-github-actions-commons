name: Test GitHub deployment and action repo inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          bitops_skip_run: 'true'
          bitops_code_store: 'false'
          bitops_extra_env_vars_file: ''
          tf_state_file_name: 'my-tf-state'
          tf_state_file_name_append: 'unique'
          tf_state_bucket_destroy: 'false'
          tf_targets: ''
          gh_deployment_input_terraform: ''
          gh_deployment_input_ansible: ''
          gh_deployment_input_ansible_extra_vars_file: ''
          gh_deployment_action_input_ansible_extra_vars_file: ''
          gh_deployment_input_helm_charts: ''
          gh_action_repo: ''
          gh_action_input_terraform: ''
          gh_action_input_ansible: ''
          gh_action_input_helm_charts: ''
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a definitive outcome"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
