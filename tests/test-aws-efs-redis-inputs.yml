name: Test AWS EFS and Redis inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          bitops_skip_run: 'true'
          aws_efs_create: 'false'
          aws_efs_fs_id: ''
          aws_efs_create_mount_target: 'false'
          aws_efs_create_ha: 'false'
          aws_efs_vol_encrypted: 'false'
          aws_efs_kms_key_id: ''
          aws_efs_performance_mode: 'generalPurpose'
          aws_efs_throughput_mode: 'bursting'
          aws_efs_throughput_speed: ''
          aws_efs_security_group_name: 'test-efs-sg'
          aws_efs_allowed_security_groups: ''
          aws_efs_ingress_allow_all: 'false'
          aws_efs_create_replica: 'false'
          aws_efs_replication_destination: ''
          aws_efs_enable_backup_policy: 'false'
          aws_efs_transition_to_inactive: ''
          aws_efs_mount_target: '/data'
          aws_efs_ec2_mount_point: '/data'
          aws_efs_additional_tags: '{"efs":"test"}'
          aws_redis_enable: 'false'
          aws_redis_user: 'redisuser'
          aws_redis_user_access_string: 'on ~* +@all'
          aws_redis_user_group_name: 'test-redis-group'
          aws_redis_security_group_name: 'test-redis-sg'
          aws_redis_ingress_allow_all: 'false'
          aws_redis_allowed_security_groups: ''
          aws_redis_subnets: ''
          aws_redis_port: '6379'
          aws_redis_at_rest_encryption: 'true'
          aws_redis_in_transit_encryption: 'true'
          aws_redis_replication_group_id: 'test-redis'
          aws_redis_node_type: 'cache.t2.small'
          aws_redis_num_cache_clusters: '1'
          aws_redis_parameter_group_name: 'default.redis7'
          aws_redis_num_node_groups: '0'
          aws_redis_replicas_per_node_group: '0'
          aws_redis_multi_az_enabled: 'false'
          aws_redis_automatic_failover: ''
          aws_redis_apply_immediately: 'false'
          aws_redis_auto_minor_upgrade: 'true'
          aws_redis_maintenance_window: ''
          aws_redis_snapshot_window: ''
          aws_redis_final_snapshot: ''
          aws_redis_snapshot_restore_name: ''
          aws_redis_cloudwatch_enabled: 'false'
          aws_redis_cloudwatch_lg_name: ''
          aws_redis_cloudwatch_log_format: 'json'
          aws_redis_cloudwatch_log_type: 'engine-log'
          aws_redis_cloudwatch_retention_days: '14'
          aws_redis_single_line_url_secret: 'false'
          aws_redis_additional_tags: '{"redis":"test"}'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
