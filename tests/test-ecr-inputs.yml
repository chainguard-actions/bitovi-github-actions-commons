name: Test ECR inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          bitops_skip_run: 'true'
          checkout: 'false'
          aws_ecr_repo_create: 'false'
          aws_ecr_repo_type: 'private'
          aws_ecr_repo_name: 'my-ecr-repo'
          aws_ecr_repo_mutable: 'false'
          aws_ecr_repo_encryption_type: 'AES256'
          aws_ecr_repo_encryption_key_arn: 'arn:aws:kms:us-east-1:123456789012:key/abc'
          aws_ecr_repo_force_destroy: 'false'
          aws_ecr_repo_image_scan: 'true'
          aws_ecr_registry_scan_rule: '[]'
          aws_ecr_registry_pull_through_cache_rules: '{}'
          aws_ecr_registry_scan_config: 'BASIC'
          aws_ecr_registry_replication_rules_input: '[]'
          aws_ecr_repo_policy_attach: 'true'
          aws_ecr_repo_policy_create: 'true'
          aws_ecr_repo_policy_input: '{}'
          aws_ecr_repo_read_arn: 'arn:aws:iam::123456789012:role/read-role'
          aws_ecr_repo_write_arn: 'arn:aws:iam::123456789012:role/write-role'
          aws_ecr_repo_read_arn_lambda: 'arn:aws:iam::123456789012:role/lambda-role'
          aws_ecr_lifecycle_policy_input: '{}'
          aws_ecr_public_repo_catalog: '{}'
          aws_ecr_registry_policy_input: '{}'
          aws_ecr_additional_tags: '{"env":"test"}'
      - name: Assert action ran
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran with ECR inputs"
          else
            echo "FAIL: unexpected outcome"
            exit 1
          fi
