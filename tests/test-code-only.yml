name: Test bitops_code_only generation phase
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with bitops_code_only enabled
        id: action
        uses: .
        with:
          checkout: 'false'
          bitops_code_only: 'true'
          aws_resource_identifier: 'test-commons-codeonly'
          aws_default_region: 'us-east-1'
          aws_ec2_instance_create: 'true'

      - name: Assert action completed successfully in code-only mode
        run: |
          echo "Action completed with bitops_code_only=true"
          echo "PASS: action exited cleanly after code generation phase"
