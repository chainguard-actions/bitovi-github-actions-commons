name: Test AWS WAF inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          checkout: 'false'
          bitops_skip_run: 'true'
          aws_waf_enable: 'false'
          aws_waf_logging_enable: 'false'
          aws_waf_log_retention_days: '7'
          aws_waf_rule_rate_limit: '1000'
          aws_waf_rule_rate_limit_priority: '1'
          aws_waf_rule_managed_rules: 'false'
          aws_waf_rule_managed_rules_priority: '2'
          aws_waf_rule_managed_bad_inputs: 'false'
          aws_waf_rule_managed_bad_inputs_priority: '3'
          aws_waf_rule_ip_reputation: 'false'
          aws_waf_rule_ip_reputation_priority: '4'
          aws_waf_rule_anonymous_ip: 'false'
          aws_waf_rule_anonymous_ip_priority: '5'
          aws_waf_rule_bot_control: 'false'
          aws_waf_rule_bot_control_priority: '6'
          aws_waf_rule_geo_block_countries: 'CN,RU'
          aws_waf_rule_geo_block_countries_priority: '7'
          aws_waf_rule_geo_allow_only_countries: 'US,CA'
          aws_waf_rule_geo_allow_only_countries_priority: '8'
          aws_waf_rule_sqli: 'false'
          aws_waf_rule_sqli_priority: '9'
          aws_waf_rule_linux: 'false'
          aws_waf_rule_linux_priority: '10'
          aws_waf_rule_unix: 'false'
          aws_waf_rule_unix_priority: '11'
          aws_waf_rule_admin_protection: 'false'
          aws_waf_rule_admin_protection_priority: '12'
          aws_waf_rule_user_arn: 'arn:aws:iam::123456789012:role/example'
          aws_waf_rule_user_arn_priority: '13'
          aws_waf_additional_tags: '{"env":"test"}'
      - name: Assert action completed
        run: |
          echo "Action completed successfully with WAF inputs"
          echo "PASS"
