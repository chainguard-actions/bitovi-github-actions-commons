name: Test AWS VPC, Route53, ELB, WAF inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          bitops_skip_run: 'true'
          aws_vpc_create: 'false'
          aws_vpc_name: 'my-vpc'
          aws_vpc_cidr_block: '10.0.0.0/16'
          aws_vpc_public_subnets: '10.10.110.0/24'
          aws_vpc_private_subnets: '10.10.120.0/24'
          aws_vpc_availability_zones: 'us-east-1a,us-east-1b'
          aws_vpc_id: ''
          aws_vpc_subnet_id: ''
          aws_vpc_enable_nat_gateway: 'false'
          aws_vpc_single_nat_gateway: 'false'
          aws_vpc_external_nat_ip_ids: ''
          aws_vpc_additional_tags: '{"env":"test"}'
          aws_r53_enable: 'false'
          aws_r53_domain_name: 'example.com'
          aws_r53_sub_domain_name: 'app'
          aws_r53_root_domain_deploy: 'false'
          aws_r53_enable_cert: 'false'
          aws_r53_cert_arn: ''
          aws_r53_create_root_cert: 'false'
          aws_r53_create_sub_cert: 'false'
          aws_r53_additional_tags: '{"env":"test"}'
          aws_elb_create: 'false'
          aws_elb_security_group_name: 'my-elb-sg'
          aws_elb_app_port: '8080'
          aws_elb_app_protocol: 'HTTP'
          aws_elb_listen_port: '80'
          aws_elb_listen_protocol: 'HTTP'
          aws_elb_healthcheck: 'TCP:22'
          aws_elb_access_log_bucket_name: 'my-elb-logs'
          aws_elb_access_log_expire: '90'
          aws_elb_additional_tags: '{"env":"test"}'
          aws_waf_enable: 'false'
          aws_waf_logging_enable: 'false'
          aws_waf_log_retention_days: '30'
          aws_waf_rule_rate_limit: '1000'
          aws_waf_rule_managed_rules: 'false'
          aws_waf_rule_managed_bad_inputs: 'false'
          aws_waf_rule_ip_reputation: 'false'
          aws_waf_rule_anonymous_ip: 'false'
          aws_waf_rule_bot_control: 'false'
          aws_waf_rule_geo_block_countries: ''
          aws_waf_rule_geo_allow_only_countries: ''
          aws_waf_rule_sqli: 'false'
          aws_waf_rule_linux: 'false'
          aws_waf_rule_unix: 'false'
          aws_waf_rule_admin_protection: 'false'
          aws_waf_rule_user_arn: ''
          aws_waf_additional_tags: '{"env":"test"}'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
