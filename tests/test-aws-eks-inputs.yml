name: Test AWS EKS inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          bitops_skip_run: 'true'
          checkout: 'false'
          aws_eks_create: 'false'
          aws_eks_security_group_name_cluster: 'my-eks-cluster-sg'
          aws_eks_security_group_name_node: 'my-eks-node-sg'
          aws_eks_environment: 'env'
          aws_eks_management_cidr: '0.0.0.0/0'
          aws_eks_allowed_ports: '443'
          aws_eks_allowed_ports_cidr: '0.0.0.0/0'
          aws_eks_cluster_name: 'eks-cluster'
          aws_eks_cluster_admin_role_arn: 'arn:aws:iam::123456789012:role/eks-admin'
          aws_eks_cluster_log_types: 'api,audit,authenticator'
          aws_eks_cluster_log_retention_days: '7'
          aws_eks_cluster_log_skip_destroy: 'false'
          aws_eks_cluster_version: '1.27'
          aws_eks_instance_type: 't3.medium'
          aws_eks_instance_ami_id: ''
          aws_eks_instance_user_data_file: ''
          aws_eks_ec2_key_pair: ''
          aws_eks_store_keypair_sm: 'false'
          aws_eks_desired_capacity: '2'
          aws_eks_max_size: '4'
          aws_eks_min_size: '1'
          aws_eks_additional_tags: '{"env":"test"}'
      - name: Assert action ran
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran with EKS inputs"
          else
            echo "FAIL: unexpected outcome"
            exit 1
          fi
