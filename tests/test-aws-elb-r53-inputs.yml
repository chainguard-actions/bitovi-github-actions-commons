name: Test AWS ELB and Route53 inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          bitops_skip_run: 'true'
          checkout: 'false'
          aws_elb_create: 'false'
          aws_elb_security_group_name: 'my-elb-sg'
          aws_elb_app_port: '8080'
          aws_elb_app_protocol: 'HTTP'
          aws_elb_listen_port: '80'
          aws_elb_listen_protocol: 'HTTP'
          aws_elb_healthcheck: 'TCP:22'
          aws_elb_access_log_bucket_name: 'my-elb-logs'
          aws_elb_access_log_expire: '90'
          aws_elb_additional_tags: '{"env":"test"}'
          aws_r53_enable: 'false'
          aws_r53_domain_name: 'example.com'
          aws_r53_sub_domain_name: 'app'
          aws_r53_root_domain_deploy: 'false'
          aws_r53_enable_cert: 'false'
          aws_r53_cert_arn: 'arn:aws:acm:us-east-1:123456789012:certificate/abc'
          aws_r53_create_root_cert: 'false'
          aws_r53_create_sub_cert: 'false'
          aws_r53_additional_tags: '{"env":"test"}'
      - name: Assert action ran
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran with ELB and R53 inputs"
          else
            echo "FAIL: unexpected outcome"
            exit 1
          fi
