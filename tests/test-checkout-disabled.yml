name: Test - Checkout disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with checkout disabled
        id: action
        uses: .
        with:
          checkout: 'false'
          bitops_skip_run: 'true'
          aws_resource_identifier: 'test-commons-nocheckout'
          aws_default_region: 'us-east-1'
        continue-on-error: true

      - name: Assert action ran with checkout disabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With checkout=false, the action skips the checkout step.
          # Combined with bitops_skip_run=true, it should exit early cleanly.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with checkout=false and bitops_skip_run=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness without full AWS setup)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
